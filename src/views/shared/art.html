<!-- ===== BỘ LỌC PIXEL HOÁ =====
     Hình nhân vật vẫn là SVG vector (để CSS còn animate được mắt/tay/bộ phận),
     nhưng đi qua bộ lọc này thì hiện ra dưới dạng KHỐI VUÔNG như sprite pixel
     art thật. Cách hoạt động: feFlood+feComposite cắt ra một ô lưới, feTile lát
     kín cả hình, feComposite operator="in" chỉ giữ lại MỘT điểm màu trong mỗi ô,
     feMorphology dilate bơm điểm đó phình ra kín ô. Kết quả: ảnh bị hạ độ phân
     giải xuống lưới cố định, và vì lọc lại mỗi khung hình nên mọi hoạt ảnh
     (chớp mắt, vung tay, hoá dạng) vẫn chạy — thứ mà xuất ra ảnh bitmap sẽ mất.
     Gắn bằng THUỘC TÍNH filter trên <g> gốc chứ không bằng CSS: styles/app.css đã dùng
     `filter:` trên chính .sprite cho quầng sáng, hai bên sẽ ghi đè nhau. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <!-- 4 đơn vị trên khung 120 → sprite quy về lưới 30×30 điểm ảnh. -->
  <filter id="pxfx" x="-25%" y="-25%" width="150%" height="150%" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feFlood x="2" y="2" width="1" height="1"/>
    <feComposite width="4" height="4"/>
    <feTile result="grid"/>
    <feComposite in="SourceGraphic" in2="grid" operator="in"/>
    <feMorphology operator="dilate" radius="2"/>
  </filter>
  <!-- Bản cho emoji cỡ lớn trong HTML: ở đây 1 đơn vị = 1px CSS, nên ô 5px
       cho emoji 48–84px ra khoảng 10–17 khối mỗi chiều — vẫn đọc được hình. -->
  <filter id="pxfxL" x="-25%" y="-25%" width="150%" height="150%" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feFlood x="2" y="2" width="1" height="1"/>
    <feComposite width="5" height="5"/>
    <feTile result="grid"/>
    <feComposite in="SourceGraphic" in2="grid" operator="in"/>
    <feMorphology operator="dilate" radius="2.5"/>
  </filter>
</svg>
