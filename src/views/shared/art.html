<!-- ===== BỘ LỌC HOÀNG GIA & VŨ TRỤ (VIBRANT FANTASY) =====
     Hệ thống bộ lọc vector cao cấp: quầng sáng mana, hiệu ứng ma thuật phát sáng (Glow Bloom)
     và viền ánh kim lấp lánh cho nhân vật & biểu tượng. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <!-- Quầng sáng ma thuật bộc phát (Magic Aura Bloom) cho nhân vật & Boss -->
  <filter id="pxfx" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
    <feComponentTransfer in="blur" result="glow">
      <feFuncA type="linear" slope="1.8" />
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="glow" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <!-- Quầng sáng mềm cho Biểu tượng & Modal Ruy-băng -->
  <filter id="pxfxL" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ffd700" flood-opacity="0.4" />
  </filter>
  <!-- Hiệu ứng chí mạng & chiếu sáng hào quang (Holy Radiance) -->
  <filter id="holyGlow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
    <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
    <feMerge>
      <feMergeNode in="blur2" />
      <feMergeNode in="blur1" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
</svg>

<!-- Khuôn hình quái Vibrant Fantasy Vector -->
<template id="tplBeast"><svg viewBox="0 0 120 120" class="beast-art fantasy-art" aria-hidden="true">
  <g class="beast-root" stroke="var(--c-stroke,#120e29)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#pxfx)">
    <circle class="chr-aura" cx="60" cy="60" r="54" fill="var(--c-aura, rgba(0, 242, 254, 0.15))" stroke="none" />
    <image class="hd2d-avatar beast-img fantasy-avatar" href="assets/images/hd2d/boss_dragon.jpg" x="0" y="0" width="120" height="120" preserveAspectRatio="xMidYMid slice" />
    <g class="bp bp-cape" style="display:none"></g>
    <g class="bp bp-wings" style="display:none"></g>
    <g class="bp bp-tail" style="display:none"></g>
    <g class="bp bp-stinger" style="display:none"></g>
    <g class="bp bp-shell" style="display:none"></g>
    <g class="bp bp-plates" style="display:none"></g>
    <g class="bp bp-stalks" style="display:none"></g>
    <g class="bp bp-antennae" style="display:none"></g>
    <g class="bp bp-ears" style="display:none"></g>
    <g class="chr-horns" fill="var(--c-horn,#ffc93c)" style="display:none"></g>
    <path class="chr-spikes" d="M60 14 l11 14 h-22z" fill="var(--c-horn,#ffc93c)" style="display:none"/>
  </g>
</svg></template>

<!-- Khuôn nhân vật Hero Vibrant Fantasy Vector -->
<template id="tplHero"><svg viewBox="0 0 120 120" class="hero-art fantasy-art" aria-hidden="true">
  <g class="hero-root" stroke="var(--c-stroke,#120e29)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#pxfx)">
    <circle class="chr-aura" cx="60" cy="60" r="54" fill="rgba(255, 215, 0, 0.2)" stroke="none" />
    <image class="hd2d-avatar hero-img fantasy-avatar" href="assets/images/hd2d/hero_wizard.jpg" x="0" y="0" width="120" height="120" preserveAspectRatio="xMidYMid slice" />
  </g>
</svg></template>
